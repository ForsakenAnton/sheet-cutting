# Netlify: a static site built by Vite. No server, functions or redirects are needed: the app has
# no routes and runs entirely in the browser.
# Response headers live in public/_headers, so they also apply to drag-and-drop deploys of dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node ^20.19 or >= 22.12.
  NODE_VERSION = "22"
